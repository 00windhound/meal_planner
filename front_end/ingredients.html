<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" crossorigin="anonymous"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3">
</head>
<body>
    <header>
        <h1>Meal Planner</h1>
        <button id = "menuButton">Menu</button>
        <nav class="headerButtons">
            <button id="home" onclick="window.location.href='front_end/home.html'">Home</button>
            <button id="ingredientsButton"  onclick="window.location.href='front_end/ingredients.html'">Ingredients</button>
            <button id="recipesButton" onclick="window.location.href='front_end/recipies.html'">Recipes</button>
            <button id="plannerButton" onclick="window.location.href='front_end/planner.html'">Planner</button>
            <button id="prioritiesButton">priorities</button>  
            <button id="helpButton">Help</button>         
            <button id="logOutButton">Log Out</button>
        </nav>
    </header>

    <h1>ingredients</h1>
    <button id = "addIngredientButton">Add Ingredient</button>
    <form id="ingredientForm" style="display: none;" action="/addIngredient" method="POST">
        <input type="text" name="name" id="ingredientName" placeholder="Ingredient Name">
        <input type="number" name="price" id="price" placeholder="Price">
        <input type="number" name="calories" id="calories" placeholder="Calories">

        <input type="submit" id="saveIngredientButton">
    </form>
    <ul id="ingredientList"></ul>
    

    <script src="ingredients.js"></script>
</body>
</html>
